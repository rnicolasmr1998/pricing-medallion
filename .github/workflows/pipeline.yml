name: Pipeline de pricing

on:
  # Ejecución automática de lunes a viernes a las 7 AM hora Lima (UTC-5 → 12:00 UTC)
  schedule:
    - cron: '0 12 * * 1-5'

  # Permite dispararlo manualmente desde la app (botón Actualizar)
  # o desde GitHub → Actions → Run workflow
  workflow_dispatch:

permissions:
  contents: write   # necesario para que el bot pueda hacer commit + push

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pipeline (bronce → silver → gold)
        run: python main.py
        env:
          TIPO_CAMBIO_USD: ${{ secrets.TIPO_CAMBIO_USD }}

      - name: Publicar datos gold al repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gold/
          git diff --cached --quiet \
            && echo "Sin cambios en gold, nada que commitear." \
            || (git commit -m "data: actualizar gold $(date -u +%Y-%m-%d)" && git push)
